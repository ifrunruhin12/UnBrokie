name: finance_app
description: A production-ready Flutter personal finance tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.3

  # Networking
  http: ^1.6.0

  # Secure storage for JWT
  flutter_secure_storage: ^10.2.0

  # Charts
  fl_chart: ^1.2.0

  # Annotations (@immutable, etc.)
  meta: ^1.17.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation for Riverpod
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0

  # Property-based testing
  glados: ^1.1.7

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
